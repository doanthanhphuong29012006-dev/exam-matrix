spring.application.name: backend

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/exam_matrix}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:your-256-bit-secret-key-for-jwt-signing-1234567890}
    expiration-minutes: 120